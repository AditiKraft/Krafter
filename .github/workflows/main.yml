# Upstream only: excluded from both generated application templates.
name: Publish template release
on:
  workflow_dispatch:
    inputs:
      template_version:
        description: 'New NuGet version, for example 1.2.3 or 1.2.3-preview.1'
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: krafter_test
          POSTGRES_PASSWORD: krafter_ci_only
          POSTGRES_DB: krafter_mfa_tests
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U krafter_test -d krafter_mfa_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KRAFTER_TEST_POSTGRES: Host=localhost;Port=5432;Database=krafter_mfa_tests;Username=krafter_test;Password=krafter_ci_only
      KRAFTER_TEST_OAUTH_POSTGRES: Host=localhost;Port=5432;Database=krafter_oauth_tests;Username=krafter_test;Password=krafter_ci_only
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Create dedicated OAuth test database
        run: docker exec "${{ job.services.postgres.id }}" createdb --username krafter_test krafter_oauth_tests
      # Existing NuGet policy: owner AditiKraft, repository Krafter, workflow main.yml.
      - name: NuGet login with trusted publishing
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Validate source and generated apps, then publish the exact version
        run: dotnet run --project ./build/_build.csproj -- --target PublishTemplate --configuration Release
        env:
          TemplateVersion: ${{ inputs.template_version }}
          NuGetPAT: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
